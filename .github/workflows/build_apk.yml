name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache buildozer
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: bz-${{ runner.os }}-p4a-20240121-${{ hashFiles('buildozer.spec') }}

    - name: Install dependencies
      run: |
        sudo apt-get update -q
        sudo apt-get install -y git zip unzip openjdk-17-jdk \
          autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev \
          libffi-dev libssl-dev build-essential \
          libgdbm-dev libsqlite3-dev libreadline-dev \
          libbz2-dev libexpat1-dev lld ccache
        pip install buildozer==1.5.0 cython==0.29.36

    - name: Build APK
      run: |
        buildozer android debug 2>&1 | tee /tmp/build.log || true
        echo ""
        echo "====== RESUMO ======"
        tail -30 /tmp/build.log
        echo "===================="
        ls -la bin/ 2>/dev/null && echo "=== APK GERADO! ===" || echo "Sem APK"
      timeout-minutes: 55

    - name: Upload APK
      if: hashFiles('bin/*.apk') != ''
      uses: actions/upload-artifact@v4
      with:
        name: VolleyBound-APK
        path: bin/*.apk
        retention-days: 30

    - name: Upload log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: /tmp/build.log
        retention-days: 7