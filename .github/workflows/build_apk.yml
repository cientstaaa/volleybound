name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache buildozer (downloads + builds)
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          .buildozer/android/platform/build-arm64-v8a
        key: bz-${{ runner.os }}-v2024.01.21-pygame210-v5-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          bz-${{ runner.os }}-v2024.01.21-pygame210-v5-

    - name: Install system dependencies
      run: |
        sudo apt-get update -q
        sudo apt-get install -y git zip unzip openjdk-17-jdk \
          autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev \
          libffi-dev libssl-dev build-essential \
          libgdbm-dev libsqlite3-dev libreadline-dev \
          libbz2-dev libexpat1-dev lld ccache
        pip install buildozer==1.5.0 cython==0.29.36

    - name: Accept Android SDK licenses
      run: |
        mkdir -p $ANDROID_SDK_ROOT/licenses
        printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n8933bad161af4178b1185d1a37fbf41ea5269c55\n' > $ANDROID_SDK_ROOT/licenses/android-sdk-license
        printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n' > $ANDROID_SDK_ROOT/licenses/android-sdk-arm-dbt-license
        printf '\n601085b94cd77f0b54ff86406957099ebe79c4d6\n' > $ANDROID_SDK_ROOT/licenses/android-sdk-preview-license
        yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
        $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
          "platform-tools" \
          "build-tools;34.0.0" \
          "platforms;android-33" \
          "platforms;android-34"

    - name: Fix sdkmanager path
      run: |
        mkdir -p $ANDROID_SDK_ROOT/tools/bin
        ln -sf $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager $ANDROID_SDK_ROOT/tools/bin/sdkmanager
        ln -sf $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager $ANDROID_SDK_ROOT/tools/bin/avdmanager

    - name: Clone p4a v2024.01.21
      run: |
        git clone --depth 1 --branch v2024.01.21 https://github.com/kivy/python-for-android.git /home/runner/p4a
        pip install -e /home/runner/p4a

    - name: Pre-instalar Apache ANT (evitar falha de rede no buildozer)
      run: |
        ANT_DIR="$HOME/.buildozer/android/platform/apache-ant-1.9.4"
        if [ ! -d "$ANT_DIR" ]; then
          echo "Baixando Apache ANT com retry..."
          mkdir -p "$HOME/.buildozer/android/platform"
          for i in 1 2 3 4 5; do
            wget -q --timeout=60 --tries=1 \
              "https://archive.apache.org/dist/ant/binaries/apache-ant-1.9.4-bin.tar.gz" \
              -O /tmp/ant.tar.gz && echo "Download OK na tentativa $i" && break
            echo "Tentativa $i falhou, aguardando 15s..."
            sleep 15
          done
          tar xzf /tmp/ant.tar.gz -C "$HOME/.buildozer/android/platform/"
          ls "$ANT_DIR/bin/"
        else
          echo "ANT ja presente no cache"
        fi

    # Fix: pygame 2.1.0 inclui src_c/_sdl2/ que foi gerado pelo Cython para Python 3.8.
    # Esse modulo e 100% incompativel com Python 3.11 que o p4a cross-compila.
    # Erros: longintrepr.h inexistente, recursion_depth, CO_NOFREE, PyCode_New, etc.
    # Solucao: deletar fisicamente src_c/_sdl2/ ANTES de compilar.
    # O jogo nao usa pygame._sdl2, entao e 100% seguro remover.
    - name: Patch recipe pygame p4a (fix longintrepr.h para Python 3.11)
      shell: python3 {0}
      run: |
        import re, os, sys

        recipe_path = "/home/runner/p4a/pythonforandroid/recipes/pygame/__init__.py"

        with open(recipe_path, "r") as f:
            original = f.read()

        print("=== Recipe pygame (primeiras 60 linhas) ===")
        for i, line in enumerate(original.splitlines()[:60], 1):
            print(f"{i:3}: {line}")

        # Metodo que sera injetado no recipe.
        # Deleta src_c/_sdl2/ fisicamente para que o setup.py simplesmente
        # nao encontre os fontes e pule a extensao pygame._sdl2 inteira.
        fix_method = (
            "\n"
            "    def build_compiled_components(self, arch):\n"
            "        import os, shutil, re as _re\n"
            "        build_dir = self.get_build_dir(arch.arch)\n"
            "\n"
            "        # 1) Deletar src_c/_sdl2/ fisicamente.\n"
            "        # O modulo pygame._sdl2 foi gerado pelo Cython para Python 3.8\n"
            "        # e e 100%% incompativel com Python 3.11.\n"
            "        sdl2_dir = os.path.join(build_dir, 'src_c', '_sdl2')\n"
            "        if os.path.isdir(sdl2_dir):\n"
            "            shutil.rmtree(sdl2_dir)\n"
            "            print('[fix] src_c/_sdl2/ DELETADO')\n"
            "        else:\n"
            "            print('[fix] src_c/_sdl2/ nao encontrado')\n"
            "\n"
            "        # 2) Remover Extension('pygame._sdl2.sdl2', ...) do setup.py.\n"
            "        # Deletar os arquivos .c nao basta - o setup.py ainda lista\n"
            "        # a extensao e tenta compila-la, falhando com 'no such file'.\n"
            "        setup_py = os.path.join(build_dir, 'setup.py')\n"
            "        if os.path.exists(setup_py):\n"
            "            with open(setup_py) as _f:\n"
            "                _src = _f.read()\n"
            "            # Remover o bloco Extension('pygame._sdl2.sdl2', ...) inteiro.\n"
            "            # O bloco comeca em 'Extension(' e termina em '),' ou ')'\n"
            "            # seguido de newline. Usamos regex guloso com nivel de parenteses.\n"
            "            _fixed = _re.sub(\n"
            "                r\"Extension\\('pygame\\._sdl2[^']*'[^)]*(?:\\([^)]*\\)[^)]*)*\\)[,]?\",\n"
            "                '',\n"
            "                _src,\n"
            "                flags=_re.DOTALL\n"
            "            )\n"
            "            if _fixed != _src:\n"
            "                with open(setup_py, 'w') as _f:\n"
            "                    _f.write(_fixed)\n"
            "                print('[fix] Extension pygame._sdl2 removida do setup.py')\n"
            "            else:\n"
            "                # Fallback: remover qualquer linha com '_sdl2' em strings\n"
            "                _lines = _src.splitlines(keepends=True)\n"
            "                _out = [l for l in _lines if '_sdl2' not in l]\n"
            "                if len(_out) != len(_lines):\n"
            "                    with open(setup_py, 'w') as _f:\n"
            "                        _f.write(''.join(_out))\n"
            "                    print('[fix] _sdl2 removido do setup.py (fallback linha)')\n"
            "                else:\n"
            "                    print('[fix] _sdl2 nao encontrado no setup.py')\n"
            "\n"
            "        super().build_compiled_components(arch)\n"
            "\n"
        )

        if "build_compiled_components" in original:
            print("build_compiled_components ja existe - atualizando...")
            m = re.search(r'\n    def build_compiled_components\(self.*?(?=\n    def |\Z)', original, re.DOTALL)
            if m:
                modified = original[:m.start()] + fix_method.rstrip('\n') + original[m.end():]
                with open(recipe_path, "w") as f:
                    f.write(modified)
                print("Substituido com sucesso!")
            else:
                print("AVISO: nao conseguiu substituir, mantendo original")
        else:
            m = re.search(r'class \w+Recipe', original)
            if not m:
                print("ERRO: classe Recipe nao encontrada!")
                sys.exit(1)
            pos = original.find('\n    def ', m.end())
            if pos < 0:
                print("ERRO: nenhum metodo encontrado na classe!")
                sys.exit(1)
            modified = original[:pos + 1] + fix_method + original[pos + 1:]
            with open(recipe_path, "w") as f:
                f.write(modified)
            print("=== build_compiled_components injetado! ===")

        with open(recipe_path) as f:
            result = f.read()
        idx = result.find("def build_compiled_components")
        if idx >= 0:
            print("=== Metodo final no recipe ===")
            print(result[idx: idx + 600])
        else:
            print("ERRO CRITICO: metodo NAO encontrado apos injecao!")
            sys.exit(1)

    - name: Preparar main.py para Android
      run: |
        cp android/main_android.py main.py
        echo "main.py substituido por android/main_android.py ($(wc -l < main.py) linhas)"

    - name: Build APK
      env:
        JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
      run: |
        set -eo pipefail
        buildozer android debug 2>&1 | tee /tmp/build.log
      timeout-minutes: 90

    - name: Verificar resultado e mostrar erros
      if: always()
      run: |
        echo ""
        echo "====== ERROS E FIX LOG ======"
        grep -n "\[ERROR\]\|fatal error\|FAILED\|Command failed\|\[fix\]\|SyntaxError\|ImportError" /tmp/build.log | tail -60 || echo "(nenhum erro)"
        echo ""
        echo "====== ULTIMAS 100 LINHAS ======"
        tail -100 /tmp/build.log
        echo "================================"
        ls -la bin/ 2>/dev/null && echo "=== APK GERADO! ===" || echo "Sem APK em bin/"

    - name: Upload APK
      if: hashFiles('bin/*.apk') != ''
      uses: actions/upload-artifact@v4
      with:
        name: VolleyBound-APK
        path: bin/*.apk
        retention-days: 30

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: /tmp/build.log
        retention-days: 7
