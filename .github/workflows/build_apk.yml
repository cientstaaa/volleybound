name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache buildozer (downloads + builds)
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          .buildozer/android/platform/build-arm64-v8a
        key: bz-${{ runner.os }}-v2024.01.21-pygame261-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          bz-${{ runner.os }}-v2024.01.21-pygame261-

    - name: Install system dependencies
      run: |
        sudo apt-get update -q
        sudo apt-get install -y git zip unzip openjdk-17-jdk \
          autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev \
          libffi-dev libssl-dev build-essential \
          libgdbm-dev libsqlite3-dev libreadline-dev \
          libbz2-dev libexpat1-dev lld ccache
        pip install buildozer==1.5.0 cython==0.29.36

    - name: Accept Android SDK licenses
      run: |
        mkdir -p $ANDROID_SDK_ROOT/licenses
        printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n8933bad161af4178b1185d1a37fbf41ea5269c55\n' > $ANDROID_SDK_ROOT/licenses/android-sdk-license
        printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n' > $ANDROID_SDK_ROOT/licenses/android-sdk-arm-dbt-license
        printf '\n601085b94cd77f0b54ff86406957099ebe79c4d6\n' > $ANDROID_SDK_ROOT/licenses/android-sdk-preview-license
        yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
        $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
          "platform-tools" \
          "build-tools;30.0.3" \
          "platforms;android-33"

    - name: Fix sdkmanager path (p4a espera caminho antigo tools/bin/)
      run: |
        mkdir -p $ANDROID_SDK_ROOT/tools/bin
        ln -sf $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager $ANDROID_SDK_ROOT/tools/bin/sdkmanager
        ln -sf $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager $ANDROID_SDK_ROOT/tools/bin/avdmanager
        echo "sdkmanager em tools/bin: $(ls -la $ANDROID_SDK_ROOT/tools/bin/sdkmanager)"

    - name: Clone p4a v2024.01.21 e corrigir recipe pygame
      run: |
        git clone --depth 1 --branch v2024.01.21 https://github.com/kivy/python-for-android.git /home/runner/p4a
        pip install -e /home/runner/p4a

        # PROBLEMA: pygame 2.1.0 inclui longintrepr.h que foi reorganizado no Python 3.11
        # SOLUÇÃO: atualizar pygame para 2.6.1 (compatível com Python 3.11+)
        RECIPE=/home/runner/p4a/pythonforandroid/recipes/pygame/__init__.py
        echo "=== Recipe pygame original (primeiras 30 linhas) ==="
        head -30 "$RECIPE"

        python3 - << 'PYEOF'
import re
recipe_path = '/home/runner/p4a/pythonforandroid/recipes/pygame/__init__.py'
with open(recipe_path, 'r') as f:
    content = f.read()

# Atualiza versão para 2.6.1
content = re.sub(r"version\s*=\s*'[^']+'", "version = '2.6.1'", content)

# Atualiza URL do download
content = re.sub(
    r'https://github\.com/pygame/pygame/archive/[^\'"]+\.tar\.gz',
    'https://github.com/pygame/pygame/archive/2.6.1.tar.gz',
    content
)

# Remove checksums (evitar falhas por hash inválido)
content = re.sub(r"md5sum\s*=\s*'[^']+'", "md5sum = None", content)
content = re.sub(r"sha256sum\s*=\s*'[^']+'", "sha256sum = None", content)

with open(recipe_path, 'w') as f:
    f.write(content)

print("Recipe pygame atualizado para 2.6.1!")
PYEOF

        # Remove patches da versão 2.1.0 (incompatíveis com 2.6.1)
        PATCHES_DIR=/home/runner/p4a/pythonforandroid/recipes/pygame/patches
        if [ -d "$PATCHES_DIR" ]; then
          echo "=== Removendo patches de pygame 2.1.0 ==="
          ls "$PATCHES_DIR"
          rm -rf "$PATCHES_DIR"
          mkdir -p "$PATCHES_DIR"
        fi

        # Limpa cache do pygame 2.1.0 para forçar download do 2.6.1
        rm -rf ~/.buildozer/android/packages/pygame/
        # Remove build artifacts do pygame para forçar recompilação
        find "$GITHUB_WORKSPACE/.buildozer" -name ".done_build*" -path "*/pygame/*" -delete 2>/dev/null || true
        find "$GITHUB_WORKSPACE/.buildozer" -name ".done_install_in_dists*" -path "*/pygame/*" -delete 2>/dev/null || true

        echo "=== Recipe pygame após patch ==="
        head -30 "$RECIPE"

    - name: Build APK
      run: |
        set -o pipefail
        buildozer android debug 2>&1 | tee /tmp/build.log
      timeout-minutes: 90

    - name: Verificar resultado e mostrar erros
      if: always()
      run: |
        echo ""
        echo "====== ERROS ENCONTRADOS ======"
        grep -n "\[ERROR\]\|error:\|Error:\|FAILED\|Command failed\|fatal error" /tmp/build.log | tail -60 || echo "(nenhum erro encontrado na busca)"
        echo ""
        echo "====== ULTIMAS 80 LINHAS ======"
        tail -80 /tmp/build.log
        echo "==============================="
        ls -la bin/ 2>/dev/null && echo "=== APK GERADO! ===" || echo "Sem APK em bin/"

    - name: Upload APK
      if: hashFiles('bin/*.apk') != ''
      uses: actions/upload-artifact@v4
      with:
        name: VolleyBound-APK
        path: bin/*.apk
        retention-days: 30

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: /tmp/build.log
        retention-days: 7