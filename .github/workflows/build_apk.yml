name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Preparar main.py para Android
      run: |
        cp android/main_android.py main.py
        echo "main.py = android/main_android.py ($(wc -l < main.py) linhas)"

    - name: Build APK com Docker buildozer
      uses: ArtemSBulgakov/buildozer-action@v1
      id: buildozer
      with:
        command: android debug
        workdir: .
        buildozer-version: stable

    - name: Upload APK
      if: steps.buildozer.outputs.filename != ''
      uses: actions/upload-artifact@v4
      with:
        name: VolleyBound-APK
        path: ${{ steps.buildozer.outputs.filename }}
        retention-days: 30
