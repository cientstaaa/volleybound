name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache buildozer (downloads + builds)
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          .buildozer/android/platform/build-arm64-v8a
        key: bz-${{ runner.os }}-v2024.01.21-pygame210-v3-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          bz-${{ runner.os }}-v2024.01.21-pygame210-v3-

    - name: Install system dependencies
      run: |
        sudo apt-get update -q
        sudo apt-get install -y git zip unzip openjdk-17-jdk \
          autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev \
          libffi-dev libssl-dev build-essential \
          libgdbm-dev libsqlite3-dev libreadline-dev \
          libbz2-dev libexpat1-dev lld ccache
        pip install buildozer==1.5.0 cython==0.29.36

    - name: Accept Android SDK licenses
      run: |
        mkdir -p $ANDROID_SDK_ROOT/licenses
        printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n8933bad161af4178b1185d1a37fbf41ea5269c55\n' > $ANDROID_SDK_ROOT/licenses/android-sdk-license
        printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n' > $ANDROID_SDK_ROOT/licenses/android-sdk-arm-dbt-license
        printf '\n601085b94cd77f0b54ff86406957099ebe79c4d6\n' > $ANDROID_SDK_ROOT/licenses/android-sdk-preview-license
        yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
        $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
          "platform-tools" \
          "build-tools;34.0.0" \
          "platforms;android-33" \
          "platforms;android-34"
        echo "=== Build tools disponiveis ==="
        ls $ANDROID_SDK_ROOT/build-tools/ 2>/dev/null || echo "Nenhum build-tools encontrado"

    - name: Fix sdkmanager path
      run: |
        mkdir -p $ANDROID_SDK_ROOT/tools/bin
        ln -sf $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager $ANDROID_SDK_ROOT/tools/bin/sdkmanager
        ln -sf $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager $ANDROID_SDK_ROOT/tools/bin/avdmanager

    - name: Clone p4a v2024.01.21
      run: |
        git clone --depth 1 --branch v2024.01.21 https://github.com/kivy/python-for-android.git /home/runner/p4a
        pip install -e /home/runner/p4a

    # pygame 2.1.0 e a versao suportada pelo p4a v2024.01.21 com todos os
    # patches Android incluidos. O problema: sdl2.c inclui "longintrepr.h"
    # que nao existe no Python 3.11. Fix: injetar build_compiled_components
    # no recipe do pygame para corrigir o arquivo antes de compilar.
    # Usamos "shell: python3 {0}" para evitar problemas de YAML com heredocs.
    - name: Fix longintrepr.h no recipe pygame (Python 3.11 compat)
      shell: python3 {0}
      run: |
        import re, os, sys

        recipe_path = "/home/runner/p4a/pythonforandroid/recipes/pygame/__init__.py"

        with open(recipe_path, "r") as f:
            original = f.read()

        print("=== Recipe pygame (primeiras 60 linhas) ===")
        for i, line in enumerate(original.splitlines()[:60], 1):
            print(f"{i:3}: {line}")

        # Metodo que corrige sdl2.c antes de compilar
        # (injeta como override de build_compiled_components no recipe)
        fix_method = (
            "\n"
            "    def build_compiled_components(self, arch):\n"
            "        import os\n"
            "        build_dir = self.get_build_dir(arch.arch)\n"
            "        sdl2c = os.path.join(build_dir, 'src_c', '_sdl2', 'sdl2.c')\n"
            "        if os.path.exists(sdl2c):\n"
            "            with open(sdl2c) as _f:\n"
            "                _code = _f.read()\n"
            "            OLD = '#include \"longintrepr.h\"'\n"
            "            if OLD in _code:\n"
            "                NEW = (\n"
            "                    '#if PY_VERSION_HEX >= 0x030c0000\\n'\n"
            "                    '#  include \"cpython/longintrepr.h\"\\n'\n"
            "                    '#else\\n'\n"
            "                    '#  include \"longintrepr.h\"\\n'\n"
            "                    '#endif'\n"
            "                )\n"
            "                with open(sdl2c, 'w') as _f:\n"
            "                    _f.write(_code.replace(OLD, NEW))\n"
            "                print('[fix] longintrepr.h corrigido em', sdl2c)\n"
            "            else:\n"
            "                print('[fix] longintrepr.h nao encontrado (ja corrigido?)')\n"
            "        else:\n"
            "            print('[fix] sdl2.c nao encontrado em', sdl2c)\n"
            "        super().build_compiled_components(arch)\n"
            "\n"
        )

        if "build_compiled_components" in original:
            print("AVISO: build_compiled_components ja existe no recipe!")
            print("Nenhuma modificacao necessaria.")
        else:
            # Encontrar o primeiro 'def' dentro da classe para inserir antes
            m = re.search(r'class \w+Recipe', original)
            if not m:
                print("ERRO: classe Recipe nao encontrada!")
                sys.exit(1)

            pos = original.find('\n    def ', m.end())
            if pos < 0:
                print("ERRO: nenhum metodo encontrado na classe!")
                sys.exit(1)

            modified = original[:pos + 1] + fix_method + original[pos + 1:]

            with open(recipe_path, "w") as f:
                f.write(modified)

            print("=== build_compiled_components injetado com sucesso! ===")

        # Verificar resultado
        with open(recipe_path) as f:
            result = f.read()

        idx = result.find("def build_compiled_components")
        if idx >= 0:
            print("=== Trecho injetado ===")
            print(result[idx: idx + 600])
        else:
            print("AVISO: build_compiled_components nao encontrado apos modificacao")

    - name: Preparar main.py para Android
      run: |
        cp android/main_android.py main.py
        echo "main.py substituido por android/main_android.py ($(wc -l < main.py) linhas)"

    - name: Build APK
      env:
        JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
      run: |
        set -o pipefail
        buildozer android debug 2>&1 | tee /tmp/build.log
      timeout-minutes: 90

    - name: Verificar resultado e mostrar erros
      if: always()
      run: |
        echo ""
        echo "====== ERROS ENCONTRADOS ======"
        grep -n "\[ERROR\]\|fatal error\|FAILED\|Command failed\|Exception\|\[fix\]" /tmp/build.log | tail -50 || echo "(nenhum erro)"
        echo ""
        echo "====== ULTIMAS 80 LINHAS ======"
        tail -80 /tmp/build.log
        echo "================================"
        ls -la bin/ 2>/dev/null && echo "=== APK GERADO! ===" || echo "Sem APK em bin/"

    - name: Upload APK
      if: hashFiles('bin/*.apk') != ''
      uses: actions/upload-artifact@v4
      with:
        name: VolleyBound-APK
        path: bin/*.apk
        retention-days: 30

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: /tmp/build.log
        retention-days: 7
