name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache buildozer (downloads + builds)
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          .buildozer/android/platform/build-arm64-v8a
        key: bz-${{ runner.os }}-v2024.01.21-pygame210-v8-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          bz-${{ runner.os }}-v2024.01.21-pygame210-v8-

    - name: Install system dependencies
      run: |
        sudo apt-get update -q
        sudo apt-get install -y git zip unzip openjdk-17-jdk \
          autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev \
          libffi-dev libssl-dev build-essential \
          libgdbm-dev libsqlite3-dev libreadline-dev \
          libbz2-dev libexpat1-dev lld ccache
        pip install buildozer==1.5.0 cython==0.29.36

    - name: Accept Android SDK licenses
      run: |
        mkdir -p $ANDROID_SDK_ROOT/licenses
        printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n8933bad161af4178b1185d1a37fbf41ea5269c55\n' > $ANDROID_SDK_ROOT/licenses/android-sdk-license
        printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n' > $ANDROID_SDK_ROOT/licenses/android-sdk-arm-dbt-license
        printf '\n601085b94cd77f0b54ff86406957099ebe79c4d6\n' > $ANDROID_SDK_ROOT/licenses/android-sdk-preview-license
        yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
        $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
          "platform-tools" \
          "build-tools;34.0.0" \
          "platforms;android-33" \
          "platforms;android-34"

    - name: Fix sdkmanager path
      run: |
        mkdir -p $ANDROID_SDK_ROOT/tools/bin
        ln -sf $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager $ANDROID_SDK_ROOT/tools/bin/sdkmanager
        ln -sf $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager $ANDROID_SDK_ROOT/tools/bin/avdmanager

    - name: Clone p4a v2024.01.21
      run: |
        git clone --depth 1 --branch v2024.01.21 https://github.com/kivy/python-for-android.git /home/runner/p4a
        pip install -e /home/runner/p4a

    - name: Pre-instalar Apache ANT
      run: |
        ANT_DIR="$HOME/.buildozer/android/platform/apache-ant-1.9.4"
        if [ ! -d "$ANT_DIR" ]; then
          mkdir -p "$HOME/.buildozer/android/platform"
          for i in 1 2 3 4 5; do
            wget -q --timeout=60 --tries=1 \
              "https://archive.apache.org/dist/ant/binaries/apache-ant-1.9.4-bin.tar.gz" \
              -O /tmp/ant.tar.gz && echo "ANT OK na tentativa $i" && break
            sleep 15
          done
          tar xzf /tmp/ant.tar.gz -C "$HOME/.buildozer/android/platform/"
        else
          echo "ANT ja no cache"
        fi

    # FIX DEFINITIVO para pygame 2.1.0 + Python 3.11:
    # 1) Cria shim longintrepr.h no include dir do Python cross-compilado
    #    (resolve o erro em _sprite.c e qualquer outro Cython-generated .c)
    # 2) Substitui TODOS os .c em _sdl2/ por stubs minimos
    #    (esses tem incompatibilidades mais profundas alem do longintrepr.h)
    - name: Patch recipe pygame p4a (Python 3.11 compat)
      shell: python3 {0}
      run: |
        import re, os, sys, glob

        recipe_path = "/home/runner/p4a/pythonforandroid/recipes/pygame/__init__.py"

        with open(recipe_path, "r") as f:
            original = f.read()

        print("=== Recipe pygame (primeiras 40 linhas) ===")
        for i, line in enumerate(original.splitlines()[:40], 1):
            print(f"{i:3}: {line}")

        fix_method = (
            "\n"
            "    def build_compiled_components(self, arch):\n"
            "        import os, glob, subprocess\n"
            "        build_dir = self.get_build_dir(arch.arch)\n"
            "\n"
            "        # --- FIX 1: Criar shim longintrepr.h ---\n"
            "        # Python 3.11 removeu longintrepr.h do include dir raiz.\n"
            "        # Cython-generated .c files (como _sprite.c) fazem:\n"
            "        #   #include \"longintrepr.h\"\n"
            "        # Criamos um shim que redireciona para o novo local.\n"
            "        python_build = os.path.join(\n"
            "            os.path.dirname(build_dir), '..', 'python3',\n"
            "            arch.arch + '__ndk_target_21', 'python3', 'Include'\n"
            "        )\n"
            "        python_build = os.path.normpath(python_build)\n"
            "        # Tambem procurar em outros locais possiveis\n"
            "        possible_dirs = [\n"
            "            python_build,\n"
            "            os.path.join(build_dir, '..', '..', '..', 'other_builds',\n"
            "                         'python3', arch.arch + '__ndk_target_21', 'python3', 'Include'),\n"
            "        ]\n"
            "        for inc_dir in possible_dirs:\n"
            "            inc_dir = os.path.normpath(inc_dir)\n"
            "            if os.path.isdir(inc_dir):\n"
            "                shim = os.path.join(inc_dir, 'longintrepr.h')\n"
            "                if not os.path.exists(shim):\n"
            "                    cpython_h = os.path.join(inc_dir, 'cpython', 'longintrepr.h')\n"
            "                    if os.path.exists(cpython_h):\n"
            "                        with open(shim, 'w') as f:\n"
            "                            f.write('/* shim */ #include \"cpython/longintrepr.h\"\\n')\n"
            "                        print('[fix] shim longintrepr.h -> cpython/ em ' + inc_dir)\n"
            "                    else:\n"
            "                        # Criar header vazio com typedef minimo\n"
            "                        with open(shim, 'w') as f:\n"
            "                            f.write('/* shim longintrepr.h for Python 3.11+ */\\n')\n"
            "                            f.write('#ifndef Py_LONGINTREPR_H\\n')\n"
            "                            f.write('#define Py_LONGINTREPR_H\\n')\n"
            "                            f.write('#include \"Python.h\"\\n')\n"
            "                            f.write('#if PY_VERSION_HEX >= 0x030C0000\\n')\n"
            "                            f.write('  #include \"cpython/longintrepr.h\"\\n')\n"
            "                            f.write('#elif PY_VERSION_HEX >= 0x030B0000\\n')\n"
            "                            f.write('  typedef uint32_t digit;\\n')\n"
            "                            f.write('#endif\\n')\n"
            "                            f.write('#endif\\n')\n"
            "                        print('[fix] shim longintrepr.h (minimal) em ' + inc_dir)\n"
            "                else:\n"
            "                    print('[fix] longintrepr.h ja existe em ' + inc_dir)\n"
            "        # Tambem colocar o shim no proprio build_dir do pygame\n"
            "        # para garantir que o compilador encontre via -Isrc_c\n"
            "        src_c = os.path.join(build_dir, 'src_c')\n"
            "        shim_local = os.path.join(src_c, 'longintrepr.h')\n"
            "        if os.path.isdir(src_c) and not os.path.exists(shim_local):\n"
            "            with open(shim_local, 'w') as f:\n"
            "                f.write('/* shim longintrepr.h for Python 3.11+ */\\n')\n"
            "                f.write('#ifndef Py_LONGINTREPR_H\\n')\n"
            "                f.write('#define Py_LONGINTREPR_H\\n')\n"
            "                f.write('#include \"Python.h\"\\n')\n"
            "                f.write('#if PY_VERSION_HEX >= 0x030C0000\\n')\n"
            "                f.write('  #include \"cpython/longintrepr.h\"\\n')\n"
            "                f.write('#elif PY_VERSION_HEX >= 0x030B0000\\n')\n"
            "                f.write('  typedef uint32_t digit;\\n')\n"
            "                f.write('#endif\\n')\n"
            "                f.write('#endif\\n')\n"
            "            print('[fix] shim longintrepr.h em src_c/')\n"
            "\n"
            "        # --- FIX 2: Stubs para _sdl2/ ---\n"
            "        # Os .c em _sdl2/ tem incompatibilidades profundas alem do\n"
            "        # longintrepr.h (CO_NOFREE, recursion_depth, PyCode_New, etc).\n"
            "        # O jogo nao usa pygame._sdl2, entao stubs sao seguros.\n"
            "        sdl2_dir = os.path.join(build_dir, 'src_c', '_sdl2')\n"
            "        if os.path.isdir(sdl2_dir):\n"
            "            _fixed = 0\n"
            "            for _fname in os.listdir(sdl2_dir):\n"
            "                if not _fname.endswith('.c'):\n"
            "                    continue\n"
            "                _modname = _fname[:-2]\n"
            "                _stub = (\n"
            "                    '/* ' + _fname + ' stub */\\n'\n"
            "                    '#define PY_SSIZE_T_CLEAN\\n'\n"
            "                    '#include \"Python.h\"\\n'\n"
            "                    'static struct PyModuleDef _md = {\\n'\n"
            "                    '    PyModuleDef_HEAD_INIT, \"' + _modname + '\", NULL, -1, NULL\\n'\n"
            "                    '};\\n'\n"
            "                    'PyMODINIT_FUNC PyInit_' + _modname + '(void) {\\n'\n"
            "                    '    return PyModule_Create(&_md);\\n'\n"
            "                    '}\\n'\n"
            "                )\n"
            "                with open(os.path.join(sdl2_dir, _fname), 'w') as _f:\n"
            "                    _f.write(_stub)\n"
            "                print('[fix] stub: _sdl2/' + _fname)\n"
            "                _fixed += 1\n"
            "            print('[fix] _sdl2/ stubs: ' + str(_fixed))\n"
            "\n"
            "        super().build_compiled_components(arch)\n"
            "\n"
        )

        if "build_compiled_components" in original:
            print("build_compiled_components ja existe - atualizando...")
            m = re.search(r'\n    def build_compiled_components\(self.*?(?=\n    def |\Z)', original, re.DOTALL)
            if m:
                modified = original[:m.start()] + fix_method.rstrip('\n') + original[m.end():]
                with open(recipe_path, "w") as f:
                    f.write(modified)
                print("Substituido!")
            else:
                print("AVISO: regex nao encontrou metodo existente")
        else:
            m = re.search(r'class \w+Recipe', original)
            if not m:
                print("ERRO: classe Recipe nao encontrada!")
                sys.exit(1)
            pos = original.find('\n    def ', m.end())
            if pos < 0:
                print("ERRO: nenhum metodo encontrado!")
                sys.exit(1)
            modified = original[:pos + 1] + fix_method + original[pos + 1:]
            with open(recipe_path, "w") as f:
                f.write(modified)
            print("=== build_compiled_components INJETADO! ===")

        with open(recipe_path) as f:
            result = f.read()
        idx = result.find("def build_compiled_components")
        if idx >= 0:
            print("=== Metodo no recipe ===")
            print(result[idx: idx + 900])
        else:
            print("ERRO CRITICO: metodo NAO encontrado!")
            sys.exit(1)

    - name: Preparar main.py para Android
      run: |
        cp android/main_android.py main.py
        echo "main.py = android/main_android.py ($(wc -l < main.py) linhas)"

    - name: Build APK
      env:
        JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
      run: |
        set -eo pipefail
        buildozer android debug 2>&1 | tee /tmp/build.log
      timeout-minutes: 90

    - name: Verificar resultado
      if: always()
      run: |
        echo "====== ERROS E FIX LOG ======"
        grep -n "\[ERROR\]\|fatal error\|FAILED\|\[fix\]\|SyntaxError\|error:" /tmp/build.log | tail -60 || echo "(nenhum)"
        echo "====== ULTIMAS 80 LINHAS ======"
        tail -80 /tmp/build.log
        ls -la bin/ 2>/dev/null && echo "=== APK GERADO! ===" || echo "Sem APK em bin/"

    - name: Upload APK
      if: hashFiles('bin/*.apk') != ''
      uses: actions/upload-artifact@v4
      with:
        name: VolleyBound-APK
        path: bin/*.apk
        retention-days: 30

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: /tmp/build.log
        retention-days: 7
