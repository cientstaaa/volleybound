name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache buildozer (downloads + builds)
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          .buildozer/android/platform/build-arm64-v8a
        key: bz-${{ runner.os }}-v2024.01.21-pygame210-longintfix-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          bz-${{ runner.os }}-v2024.01.21-pygame210-longintfix-

    - name: Install system dependencies
      run: |
        sudo apt-get update -q
        sudo apt-get install -y git zip unzip openjdk-17-jdk \
          autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev \
          libffi-dev libssl-dev build-essential \
          libgdbm-dev libsqlite3-dev libreadline-dev \
          libbz2-dev libexpat1-dev lld ccache
        pip install buildozer==1.5.0 cython==0.29.36

    - name: Accept Android SDK licenses
      run: |
        mkdir -p $ANDROID_SDK_ROOT/licenses
        printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n8933bad161af4178b1185d1a37fbf41ea5269c55\n' > $ANDROID_SDK_ROOT/licenses/android-sdk-license
        printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n' > $ANDROID_SDK_ROOT/licenses/android-sdk-arm-dbt-license
        printf '\n601085b94cd77f0b54ff86406957099ebe79c4d6\n' > $ANDROID_SDK_ROOT/licenses/android-sdk-preview-license
        yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
        $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
          "platform-tools" \
          "build-tools;34.0.0" \
          "platforms;android-33" \
          "platforms;android-34"
        echo "=== Build tools disponiveis ==="
        ls $ANDROID_SDK_ROOT/build-tools/ 2>/dev/null || echo "Nenhum build-tools encontrado"

    - name: Fix sdkmanager path
      run: |
        mkdir -p $ANDROID_SDK_ROOT/tools/bin
        ln -sf $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager $ANDROID_SDK_ROOT/tools/bin/sdkmanager
        ln -sf $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager $ANDROID_SDK_ROOT/tools/bin/avdmanager

    - name: Clone p4a v2024.01.21
      run: |
        git clone --depth 1 --branch v2024.01.21 https://github.com/kivy/python-for-android.git /home/runner/p4a
        pip install -e /home/runner/p4a

    # pygame 2.1.0 e a versao suportada nativamente pelo p4a v2024.01.21
    # com todos os patches de compatibilidade Android incluidos.
    # NAO remover os patches — eles sao essenciais para o SDL2 funcionar no Android.
    # Fix: o sdl2.c do pygame 2.1.0 inclui "longintrepr.h" que nao existe no
    # Python 3.11 cross-compilado pelo p4a. Solucao: fazer o patch inline no recipe
    # do p4a ANTES do buildozer rodar, usando o mecanismo de patches do p4a.
    - name: Patch recipe pygame p4a (fix longintrepr.h para Python 3.11)
      run: |
        PYGAME_RECIPE=/home/runner/p4a/pythonforandroid/recipes/pygame/__init__.py

        echo "=== Recipe pygame atual ==="
        grep -n "version\|url\|md5\|sha512\|depends\|patches" "$PYGAME_RECIPE" | head -30

        PATCHES_DIR=/home/runner/p4a/pythonforandroid/recipes/pygame/patches
        mkdir -p "$PATCHES_DIR"

        # Criar patch que corrige o include do longintrepr.h para Python 3.11+
        cat > "$PATCHES_DIR/fix-longintrepr-py311.patch" << 'ENDPATCH'
--- a/src_c/_sdl2/sdl2.c
+++ b/src_c/_sdl2/sdl2.c
@@ -208,7 +208,11 @@
 #include "pygame.h"
 #include "pgcompat.h"
 #include "doc/sdl2_doc.h"
-#include "longintrepr.h"
+#if PY_VERSION_HEX >= 0x030c0000
+#  include "cpython/longintrepr.h"
+#elif defined(PY_VERSION_HEX)
+#  include "longintrepr.h"
+#endif
ENDPATCH

        echo "Patch criado:"
        cat "$PATCHES_DIR/fix-longintrepr-py311.patch"

        # Verificar patches existentes no recipe
        echo "=== Patches existentes ==="
        ls "$PATCHES_DIR/" 2>/dev/null || echo "(nenhum patch)"

        # Verificar se o recipe ja lista patches e adicionar o novo se necessario
        python3 - << 'PYEOF'
import ast, re

recipe_path = "/home/runner/p4a/pythonforandroid/recipes/pygame/__init__.py"
with open(recipe_path, "r") as f:
    content = f.read()

print("Patches no recipe:", re.findall(r"patches\s*=\s*\[.*?\]", content, re.DOTALL))

# Adicionar o patch na lista de patches se nao estiver la
if "fix-longintrepr-py311.patch" not in content:
    # Verificar se tem lista de patches
    if "patches = [" in content:
        content = content.replace(
            "patches = [",
            'patches = [\n        "fix-longintrepr-py311.patch",'
        )
    elif "patches = (" in content:
        content = content.replace(
            "patches = (",
            'patches = (\n        "fix-longintrepr-py311.patch",'
        )
    else:
        # Adicionar patches antes do metodo build_arch ou get_recipe_env
        insert_pos = content.find("    def build_arch")
        if insert_pos == -1:
            insert_pos = content.find("    def get_recipe_env")
        if insert_pos > 0:
            content = content[:insert_pos] + '    patches = ["fix-longintrepr-py311.patch"]\n\n' + content[insert_pos:]
    
    with open(recipe_path, "w") as f:
        f.write(content)
    print("Patch adicionado ao recipe!")
else:
    print("Patch ja presente no recipe.")
PYEOF

        echo "=== Recipe apos modificacao (patches) ==="
        grep -n "patches\|fix-long" "$PYGAME_RECIPE" | head -20

    - name: Preparar main.py para Android
      run: |
        # p4a sempre exige main.py como entry point na raiz
        # android/main_android.py tem os controles touch para Android
        cp android/main_android.py main.py
        echo "main.py substituido por android/main_android.py ($(wc -l < main.py) linhas)"

    - name: Build APK
      env:
        JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
      run: |
        set -o pipefail
        buildozer android debug 2>&1 | tee /tmp/build.log
      timeout-minutes: 90

    - name: Verificar resultado e mostrar erros
      if: always()
      run: |
        echo ""
        echo "====== GRADLE OUTPUT (antes do erro) ======"
        grep -n -A 5 "gradlew\|BUILD FAILED\|FAILURE:\|Exception\|error:" /tmp/build.log | tail -100 || echo "(sem log gradle)"
        echo ""
        echo "====== ERROS ENCONTRADOS ======"
        grep -n "\[ERROR\]\|fatal error\|FAILED\|Command failed\|Exception" /tmp/build.log | tail -40 || echo "(nenhum erro)"
        echo ""
        echo "====== ULTIMAS 100 LINHAS ======"
        tail -100 /tmp/build.log
        echo "==============================="
        ls -la bin/ 2>/dev/null && echo "=== APK GERADO! ===" || echo "Sem APK em bin/"

    - name: Upload APK
      if: hashFiles('bin/*.apk') != ''
      uses: actions/upload-artifact@v4
      with:
        name: VolleyBound-APK
        path: bin/*.apk
        retention-days: 30

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: /tmp/build.log
        retention-days: 7
