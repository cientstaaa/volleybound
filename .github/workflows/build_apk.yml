name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache buildozer (downloads + builds)
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          .buildozer/android/platform/build-arm64-v8a
        key: bz-${{ runner.os }}-v2024.01.21-pygame261-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          bz-${{ runner.os }}-v2024.01.21-pygame261-

    - name: Install system dependencies
      run: |
        sudo apt-get update -q
        sudo apt-get install -y git zip unzip openjdk-17-jdk \
          autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev \
          libffi-dev libssl-dev build-essential \
          libgdbm-dev libsqlite3-dev libreadline-dev \
          libbz2-dev libexpat1-dev lld ccache
        pip install buildozer==1.5.0 cython==0.29.36

    - name: Accept Android SDK licenses
      run: |
        mkdir -p $ANDROID_SDK_ROOT/licenses
        printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n8933bad161af4178b1185d1a37fbf41ea5269c55\n' > $ANDROID_SDK_ROOT/licenses/android-sdk-license
        printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n' > $ANDROID_SDK_ROOT/licenses/android-sdk-arm-dbt-license
        printf '\n601085b94cd77f0b54ff86406957099ebe79c4d6\n' > $ANDROID_SDK_ROOT/licenses/android-sdk-preview-license
        yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
        $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
          "platform-tools" \
          "build-tools;30.0.3" \
          "platforms;android-33"

    - name: Fix sdkmanager path
      run: |
        mkdir -p $ANDROID_SDK_ROOT/tools/bin
        ln -sf $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager $ANDROID_SDK_ROOT/tools/bin/sdkmanager
        ln -sf $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager $ANDROID_SDK_ROOT/tools/bin/avdmanager

    - name: Clone p4a v2024.01.21
      run: |
        git clone --depth 1 --branch v2024.01.21 https://github.com/kivy/python-for-android.git /home/runner/p4a
        pip install -e /home/runner/p4a

    - name: Patch pygame recipe para 2.6.1 (fix Python 3.11)
      run: |
        RECIPE=/home/runner/p4a/pythonforandroid/recipes/pygame/__init__.py
        echo "=== Recipe original ==="
        head -15 "$RECIPE"

        # Atualizar versão para 2.6.1
        sed -i "s/version = '2\.1\.0'/version = '2.6.1'/" "$RECIPE"

        # IMPORTANTE: Usar URL do PyPI (inclui .c pré-gerados) em vez de GitHub
        # GitHub archive NÃO inclui .c gerados pelo Cython, PyPI sdist SIM!
        sed -i "s|url = 'https://github.com/pygame/pygame/archive/2\.1\.0\.tar\.gz'|url = 'https://files.pythonhosted.org/packages/source/p/pygame/pygame-2.6.1.tar.gz'|" "$RECIPE"
        # Fallback caso o campo url tenha formato diferente
        sed -i "s|pygame/archive/2\.1\.0\.tar\.gz|files.pythonhosted.org/packages/source/p/pygame/pygame-2.6.1.tar.gz|" "$RECIPE"
        sed -i "s/md5sum = '[^']*'/md5sum = None/" "$RECIPE"
        sed -i "s/sha256sum = '[^']*'/sha256sum = None/" "$RECIPE"

        # Remover patches incompatíveis com 2.6.1
        if [ -d /home/runner/p4a/pythonforandroid/recipes/pygame/patches ]; then
          echo "Removendo patches pygame 2.1.0..."
          rm -f /home/runner/p4a/pythonforandroid/recipes/pygame/patches/*.patch
        fi

        echo "=== Recipe atualizado ==="
        head -20 "$RECIPE"

        # Limpar cache pygame antigo
        rm -rf ~/.buildozer/android/packages/pygame/
        find "$GITHUB_WORKSPACE/.buildozer" -name ".done_build*" -path "*/pygame/*" -delete 2>/dev/null || true

    - name: Build APK
      run: |
        set -o pipefail
        buildozer android debug 2>&1 | tee /tmp/build.log
      timeout-minutes: 90

    - name: Verificar resultado e mostrar erros
      if: always()
      run: |
        echo ""
        echo "====== ERROS ENCONTRADOS ======"
        grep -n "\[ERROR\]\|fatal error\|error:\|FAILED\|Command failed" /tmp/build.log | tail -60 || echo "(nenhum erro)"
        echo ""
        echo "====== ULTIMAS 80 LINHAS ======"
        tail -80 /tmp/build.log
        echo "==============================="
        ls -la bin/ 2>/dev/null && echo "=== APK GERADO! ===" || echo "Sem APK em bin/"

    - name: Upload APK
      if: hashFiles('bin/*.apk') != ''
      uses: actions/upload-artifact@v4
      with:
        name: VolleyBound-APK
        path: bin/*.apk
        retention-days: 30

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: /tmp/build.log
        retention-days: 7