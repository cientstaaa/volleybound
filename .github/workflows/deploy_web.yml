name: Deploy Web (Pygbag → GitHub Pages)

on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - "bola.py"
      - "jogador.py"
      - "constantes.py"
      - "assets/**"
      - ".github/workflows/deploy_web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pygbag
        run: pip install pygbag

      # Copia arquivos compartilhados para dentro da pasta web/
      # (Pygbag precisa que tudo esteja junto com o main.py)
      - name: Copiar arquivos compartilhados para web/
        run: |
          cp bola.py web/
          cp jogador.py web/
          cp constantes.py web/
          cp -r assets web/

      # Pygbag compila e gera o bundle em web/build/web/
      - name: Build com Pygbag
        run: python -m pygbag --build web/main.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
